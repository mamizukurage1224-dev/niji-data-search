# 他枠出演レーダーのデータを Holodex から取り、gh-pages ブランチ（GitHub Pages）に置く。
# 定期実行は GitHub の schedule を使わず、Cloudflare の Worker（niji-oshikatsu-tools の trigger/）が
# 毎時7・22・37・52分に workflow_dispatch で起こす（schedule は数時間遅れることがあり、
# 公開リポジトリで60日動きがないと止まるため。2026-09-26）。手動実行もここから。
name: radar

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write   # マスターの見直しが要るチャンネルを Issue で知らせる

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # 前回の出力と state.json（差分取得に使う）を取り出す。初回は gh-pages が無いので飛ばす
      - name: Restore previous data
        run: |
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            git fetch --depth 1 origin gh-pages
            mkdir -p out
            git --work-tree=out checkout origin/gh-pages -- .
            git reset -q
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test
        run: python -m unittest discover tests

      # 失敗したら（終了コード1）ここで止まり、gh-pages は前回のまま残る
      - name: Run radar
        env:
          HOLODEX_API_KEY: ${{ secrets.HOLODEX_API_KEY }}
          MASTER_CSV_URL: ${{ vars.MASTER_CSV_URL }}
          OUT_DIR: out
        run: |
          rm -f channel_check.md
          python batch/radar.py

      - name: Publish to gh-pages
        run: |
          cd out
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # マスターに無いチャンネル（新人など）や、活動を終えたらしいチャンネルを見つけたら Issue で知らせる。
      # 開いている同じ題名の Issue があれば、そこにコメントを足す（どちらも通知が届く）
      - name: Report channels to review
        if: hashFiles('channel_check.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="ライバーマスターの見直しが必要なチャンネルがあります"
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" \
                  --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body-file channel_check.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file channel_check.md
          fi
